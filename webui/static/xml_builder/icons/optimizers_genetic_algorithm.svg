<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Genetic Algorithm">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="rgba(231,237,247,0.85)"/>
    </marker>
  </defs>

  <rect x="28" y="28" width="200" height="200" rx="32" fill="#0f1726" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- parents -->
    <path d="M76 96 H180" stroke="rgba(231,237,247,0.35)" stroke-width="5"/>
    <path d="M76 128 H180" stroke="rgba(231,237,247,0.35)" stroke-width="5"/>

    <!-- genes -->
    <g fill="rgba(121,198,255,0.85)" stroke="rgba(15,23,38,0.8)" stroke-width="3">
      <circle cx="88" cy="96" r="7"/><circle cx="112" cy="96" r="7"/><circle cx="136" cy="96" r="7"/><circle cx="160" cy="96" r="7"/>
      <circle cx="88" cy="128" r="7"/><circle cx="112" cy="128" r="7"/><circle cx="136" cy="128" r="7"/><circle cx="160" cy="128" r="7"/>
    </g>

    <!-- crossover -->
    <path d="M120 86 L144 138" stroke="rgba(231,237,247,0.60)" stroke-width="4"/>
    <path d="M144 86 L120 138" stroke="rgba(231,237,247,0.60)" stroke-width="4"/>
    <path d="M128 144 V156" stroke="rgba(231,237,247,0.55)" stroke-width="4" marker-end="url(#arrowHead)"/>

    <!-- offspring -->
    <path d="M88 176 H168" stroke="rgba(121,198,255,0.80)" stroke-width="6"/>
    <g fill="rgba(231,237,247,0.90)" stroke="rgba(15,23,38,0.8)" stroke-width="3">
      <circle cx="100" cy="176" r="7"/><circle cx="124" cy="176" r="7"/><circle cx="148" cy="176" r="7"/>
    </g>
    <circle cx="176" cy="176" r="10" stroke="rgba(231,237,247,0.85)" stroke-width="4"/>
    <circle cx="176" cy="176" r="4" fill="rgba(231,237,247,0.95)"/>
  </g>
</svg>
