<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Simulated Annealing">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,120,90,0.95)"/>
      <stop offset="1" stop-color="rgba(121,198,255,0.85)"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="rgba(231,237,247,0.85)"/>
    </marker>
  </defs>

  <rect x="28" y="28" width="200" height="200" rx="32" fill="#0f1726" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- rugged landscape -->
    <path d="M64 156 C78 132 92 178 108 156 C122 136 134 168 148 144 C162 118 174 162 190 136"
          stroke="rgba(231,237,247,0.25)" stroke-width="5"/>
    <path d="M64 156 C78 132 92 178 108 156 C122 136 134 168 148 144 C162 118 174 162 190 136"
          stroke="rgba(121,198,255,0.75)" stroke-width="3"/>

    <!-- hop over local minimum -->
    <path d="M96 150 C112 116 142 116 160 144" stroke="rgba(231,237,247,0.65)" stroke-width="4" marker-end="url(#arrowHead)"/>
    <circle cx="96" cy="150" r="8" fill="rgba(231,237,247,0.85)" stroke="rgba(15,23,38,0.8)" stroke-width="3"/>
    <circle cx="160" cy="144" r="10" stroke="rgba(231,237,247,0.85)" stroke-width="4"/>
    <circle cx="160" cy="144" r="4" fill="rgba(231,237,247,0.95)"/>

    <!-- temperature / cooling -->
    <path d="M176 78 V116" stroke="rgba(231,237,247,0.45)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="176" cy="124" r="10" fill="url(#heat)" stroke="rgba(231,237,247,0.55)" stroke-width="3"/>
    <path d="M176 78 V112" stroke="url(#heat)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
