<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Model: ROM">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(139,233,253,0.75)"/>
      <stop offset="1" stop-color="rgba(121,198,255,0.65)"/>
    </linearGradient>
  </defs>

  <rect x="28" y="28" width="200" height="200" rx="32" fill="#0f1726" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="78" width="100" height="100" rx="20" fill="url(#chip)" stroke="rgba(231,237,247,0.25)" stroke-width="2"/>

    <!-- neural network (ROM surrogate) -->
    <g fill="none" stroke="rgba(231,237,247,0.45)" stroke-width="3" stroke-linecap="round">
      <path d="M102 108 L128 126"/>
      <path d="M102 128 L128 126"/>
      <path d="M102 148 L128 126"/>
      <path d="M102 108 L128 154"/>
      <path d="M102 128 L128 154"/>
      <path d="M102 148 L128 154"/>
      <path d="M128 126 L156 140"/>
      <path d="M128 154 L156 140"/>
    </g>
    <g fill="#e7edf7" stroke="rgba(15,23,38,0.70)" stroke-width="2">
      <circle cx="102" cy="108" r="6"/>
      <circle cx="102" cy="128" r="6"/>
      <circle cx="102" cy="148" r="6"/>
      <circle cx="128" cy="126" r="7"/>
      <circle cx="128" cy="154" r="7"/>
      <circle cx="156" cy="140" r="7"/>
    </g>

    <!-- reduction arrows -->
    <g fill="none" stroke="rgba(139,233,253,0.85)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M92 170 H126"/>
      <path d="M118 162 L126 170 L118 178"/>
      <path d="M164 170 H130"/>
      <path d="M138 162 L130 170 L138 178"/>
    </g>
