<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Model: Code">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(139,233,253,0.75)"/>
      <stop offset="1" stop-color="rgba(121,198,255,0.65)"/>
    </linearGradient>
  </defs>

  <rect x="28" y="28" width="200" height="200" rx="32" fill="#0f1726" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="78" width="100" height="100" rx="20" fill="url(#chip)" stroke="rgba(231,237,247,0.25)" stroke-width="2"/>

    <!-- "known software" window -->
    <rect x="96" y="104" width="64" height="52" rx="12" fill="rgba(15,23,38,0.35)" stroke="rgba(231,237,247,0.22)" stroke-width="2"/>
    <path d="M96 118 H160" stroke="rgba(231,237,247,0.18)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="106" cy="112" r="3" fill="rgba(231,237,247,0.55)"/>
    <circle cx="116" cy="112" r="3" fill="rgba(231,237,247,0.35)"/>
    <circle cx="126" cy="112" r="3" fill="rgba(231,237,247,0.35)"/>

    <!-- gear (interface) -->
    <g transform="translate(0,0)" fill="none" stroke="rgba(231,237,247,0.80)" stroke-width="3" stroke-linecap="round">
      <circle cx="128" cy="140" r="10"/>
      <path d="M128 125 V129"/>
      <path d="M128 151 V155"/>
      <path d="M113 140 H117"/>
      <path d="M139 140 H143"/>
      <path d="M118 130 L121 133"/>
      <path d="M135 147 L138 150"/>
      <path d="M118 150 L121 147"/>
      <path d="M135 133 L138 130"/>
    </g>

    <!-- plug to emphasize "interface" -->
    <path d="M176 128 h18 v12 h-9 v12 h-9 z" fill="rgba(231,237,247,0.80)"/>
    <path d="M160 134 H176" stroke="rgba(231,237,247,0.80)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
