<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Model: ExternalModel">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(139,233,253,0.75)"/>
      <stop offset="1" stop-color="rgba(121,198,255,0.65)"/>
    </linearGradient>
  </defs>

  <rect x="28" y="28" width="200" height="200" rx="32" fill="#0f1726" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="78" width="96" height="100" rx="20" fill="url(#chip)" stroke="rgba(231,237,247,0.25)" stroke-width="2"/>
    <rect x="92" y="104" width="56" height="48" rx="12" fill="rgba(15,23,38,0.25)" stroke="rgba(231,237,247,0.18)" stroke-width="2"/>

    <!-- simplified "python" mark (not official logo) -->
    <g>
      <path d="M104 112
               c0-6 5-10 11-10
               h12 c4 0 7 3 7 7
               v10 c0 4-3 7-7 7
               h-8 c-4 0-7 3-7 7
               v1 c0 4-3 7-7 7
               h-1 c-6 0-10-5-10-11
               z"
            fill="rgba(55, 118, 171, 0.92)"/>
      <path d="M136 144
               c0 6-5 10-11 10
               h-12 c-4 0-7-3-7-7
               v-10 c0-4 3-7 7-7
               h8 c4 0 7-3 7-7
               v-1 c0-4 3-7 7-7
               h1 c6 0 10 5 10 11
               z"
            fill="rgba(255, 212, 59, 0.92)"/>
      <circle cx="132" cy="110" r="2.5" fill="rgba(15,23,38,0.75)"/>
      <circle cx="116" cy="146" r="2.5" fill="rgba(15,23,38,0.75)"/>
    </g>

    <!-- plug -->
    <path d="M182 128 h16 v12 h-8 v12 h-8 z" fill="rgba(231,237,247,0.80)"/>
    <path d="M168 134 H182" stroke="rgba(231,237,247,0.80)" stroke-width="4" stroke-linecap="round"/>
