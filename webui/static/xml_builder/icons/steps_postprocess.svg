<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="PostProcess">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="200" height="200" rx="32" fill="#0f1726" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- pipeline block -->
    <rect x="62" y="84" width="164" height="88" rx="20" fill="rgba(121,198,255,0.12)" stroke="rgba(231,237,247,0.32)" stroke-width="2"/>

    <!-- filter/funnel -->
    <path d="M90 104 H198 L164 136 V160 H124 V136 Z"
          fill="rgba(15,23,38,0.45)" stroke="rgba(231,237,247,0.30)" stroke-width="3"/>

    <!-- "processed" dots -->
    <g fill="rgba(121,198,255,0.80)" stroke="rgba(15,23,38,0.75)" stroke-width="3">
      <circle cx="104" cy="124" r="7"/>
      <circle cx="130" cy="124" r="7"/>
      <circle cx="156" cy="124" r="7"/>
    </g>
    <g fill="rgba(231,237,247,0.90)" stroke="rgba(15,23,38,0.75)" stroke-width="3">
      <circle cx="132" cy="152" r="7"/>
      <circle cx="156" cy="152" r="7"/>
    </g>
  </g>
</svg>
