  Release-Info:
    # Decide whether the release test is needed and which release version to test.
    # It runs for a pushed RAVENv* tag, a PR labeled 'release-candidate', or a change to
    # the release packaging (setup.py, MANIFEST.in, dependencies.xml, this workflow).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      version: ${{ steps.version.outputs.raven_version }}
      index-name: ${{ steps.version.outputs.index_name }}
      index-url: ${{ steps.version.outputs.index_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for the release tags and the changed files

      - name: Check Release Test Trigger
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RC_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release-candidate') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=false
          if [ "$REF_TYPE" = tag ] || [ "$RC_LABEL" = true ]; then
            run=true
          elif git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" \
                | grep -qxE 'setup\.py|MANIFEST\.in|dependencies\.xml|\.github/workflows/github-actions\.yml'; then
              run=true
            fi
          fi
          echo "Release test needed: ${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The version in setup.py is not committed for a release (e.g. setup.py at RAVENv3.3rc1
      # still reads 3.2; only the packaged setup.py has 3.3rc1), so the version is taken from
      # the package indexes instead: the newest raven-framework release on either PyPI or
      # TestPyPI (PyPI wins a tie). For a pushed RAVENv* tag, the tag's version is tested,
      # from PyPI if it has been published there, or else from TestPyPI.
      - name: Extract RAVEN Version
        id: version
        if: steps.gate.outputs.run == 'true'
        env:
          TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m pip install packaging
          python - <<'EOF'
          import json
          import os
          import urllib.request
          from packaging.version import InvalidVersion, Version

          indexes = {'PyPI': 'https://pypi.org', 'TestPyPI': 'https://test.pypi.org'}

          def releases(host):
            """ Versions on the index with at least one non-yanked file """
            with urllib.request.urlopen(f'{host}/pypi/raven-framework/json') as response:
              data = json.load(response)
            versions = set()
            for version, files in data['releases'].items():
              if any(not f.get('yanked', False) for f in files):
                try:
                  versions.add(Version(version))
                except InvalidVersion:
                  pass
            return versions

          found = {name: releases(host) for name, host in indexes.items()}
          for name, versions in found.items():
            print(f'Latest on {name}: {max(versions) if versions else None}')
          tagVersion = os.environ['TAG_VERSION'].removeprefix('RAVENv')
          if tagVersion:
            version = Version(tagVersion)
          else:
            version = max(found['PyPI'] | found['TestPyPI'])
          # PyPI first, so it is chosen when both indexes have the version
          index = next((name for name in indexes if version in found[name]), 'TestPyPI')
          print(f'Detected RAVEN_VERSION={version} on {index}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write(f'raven_version={version}\n')
            out.write(f'index_name={index}\n')
            out.write(f'index_url={indexes[index]}/simple/\n')
          EOF

  Test-RAVEN-Release:
    # Test the latest raven-framework release installed from PyPI or TestPyPI (no plugins)
    name: Test-RAVEN-Release (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.dist }})
    needs: Release-Info
    if: needs.Release-Info.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # combinations without a built package for the release are skipped by 'Check Release Package'
        python-version: ['3.10', '3.11']
        # Linux installs are expected to build from the source tar.gz (sdist); others use wheels
        include:
          - os: ubuntu-latest
            dist: sdist
          - os: macos-latest
            dist: wheel
          - os: windows-latest
            dist: wheel
    env:
      RAVEN_VERSION: ${{ needs.Release-Info.outputs.version }}
      RAVEN_INDEX_NAME: ${{ needs.Release-Info.outputs.index-name }}
      RAVEN_INDEX_URL: ${{ needs.Release-Info.outputs.index-url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " Testing raven-framework==${RAVEN_VERSION} (${{ matrix.dist }}) from ${RAVEN_INDEX_NAME} with Python ${{ matrix.python-version }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only test platforms with a built package for this release; e.g. 3.3rc1 has no Linux wheel.
      # pip picks wheels by this interpreter's tags, so it decides what matches this OS/Python.
      # The sdist is built without build isolation: an isolated build would look for setuptools
      # on the release index, so the build tools (setuptools, wheel, swig) are installed from PyPI instead.
      - name: Check Release Package
        id: release
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.dist }}" = sdist ]; then
            python -m pip install setuptools wheel swig
            dist_opts="--no-binary=:all: --no-build-isolation"
          else
            dist_opts="--only-binary=:all:"
          fi
          if python -m pip download -i "${RAVEN_INDEX_URL}" --no-deps ${dist_opts} \
              -d "${RUNNER_TEMP}/raven_dist" raven-framework==${RAVEN_VERSION}; then
            ls "${RUNNER_TEMP}/raven_dist"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No raven-framework==${RAVEN_VERSION} ${{ matrix.dist }} on ${RAVEN_INDEX_NAME} for ${{ runner.os }} / Python ${{ matrix.python-version }}; skipping release test."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # The regression tests and test harness come from the source tree matching the release
      - name: Fetch Release Source
        if: steps.release.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: RAVENv${{ env.RAVEN_VERSION }}

      # Only raven-framework comes from the release index; its dependencies come from PyPI so
      # that unrelated (and untrusted) packages on TestPyPI are never picked up.
      - name: Install RAVEN Release
        if: steps.release.outputs.available == 'true'
        run: |
          python -m pip install --no-deps --no-build-isolation "${RUNNER_TEMP}"/raven_dist/*
          python -c "from importlib.metadata import requires; print('\n'.join(requires('raven_framework')))" > raven_requirements.txt
          cat raven_requirements.txt
          python -m pip install -r raven_requirements.txt
          python -m pip show raven-framework

      - name: Check Installed Package
        if: steps.release.outputs.available == 'true'
        # run from outside the source tree so the installed package, not the checkout, is imported
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import ravenframework, crow_modules, AMSC; print('ravenframework from', ravenframework.__file__)"
          command -v raven_framework

      - name: Library Report
        if: steps.release.outputs.available == 'true'
        run: |
          ./run_tests --library-report --skip-load-env

      # Call rook directly rather than ./run_tests: "run_tests --raven" also runs the PluginAPI
      # tests, which need ExamplePlugin registered in plugins/plugin_directory.xml (done by
      # establish_conda_env.sh), and no plugins are installed for the release test.
      # The user_guide tests are simple and quick; use them to check the installed package works
      - name: Test RAVEN Release (user_guide)
        if: steps.release.outputs.available == 'true'
        run: |
          python rook/main.py -j4 --config-file=developer_tools/rook.ini --re="user_guide" --tester-command RavenFramework raven_framework

      - name: Test RAVEN Release (all RavenFramework tests)
        if: steps.release.outputs.available == 'true'
        run: |
          python rook/main.py -j4 --config-file=developer_tools/rook.ini --only-testers RavenFramework --tester-command RavenFramework raven_framework
        continue-on-error: true
