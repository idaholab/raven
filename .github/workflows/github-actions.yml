  Test-RAVEN-Release:
    # Test the raven-framework release candidate installed from TestPyPI (no plugins)
    name: Test-RAVEN-Release (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # raven-framework 3.3rc1 wheels are built for Python 3.10 and 3.11
        python-version: ['3.10', '3.11']
    env:
      RAVEN_VERSION: 3.3rc1
    defaults:
      run:
        shell: bash
    steps:
      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " Testing raven-framework==${RAVEN_VERSION} from TestPyPI with Python ${{ matrix.python-version }}"

      # The regression tests and test harness come from the source tree matching the release
      - name: Fetch Release Source
        uses: actions/checkout@v4
        with:
          ref: RAVENv${{ env.RAVEN_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No Linux wheel is published, so pip builds from the sdist, which needs swig
      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools wheel swig

      # Only raven-framework comes from TestPyPI; its dependencies come from PyPI so that
      # unrelated (and untrusted) packages on TestPyPI are never picked up.
      - name: Install RAVEN Release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -i https://test.pypi.org/simple/ --no-deps raven-framework==${RAVEN_VERSION}
          python -c "from importlib.metadata import requires; print('\n'.join(requires('raven_framework')))" > raven_requirements.txt
          cat raven_requirements.txt
          python -m pip install -r raven_requirements.txt
          python -m pip show raven-framework

      - name: Check Installed Package
        # run from outside the source tree so the installed package, not the checkout, is imported
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import ravenframework, crow_modules, AMSC; print('ravenframework from', ravenframework.__file__)"
          command -v raven_framework

      - name: Library Report
        run: |
          ./run_tests --library-report --skip-load-env

      # The user_guide tests are simple and quick; use them to check the installed package works
      - name: Test RAVEN Release (user_guide)
        run: |
          ./run_tests -j4 --raven --re="user_guide" --tester-command RavenFramework raven_framework --skip-load-env

      - name: Test RAVEN Release (all RavenFramework tests)
        run: |
          ./run_tests -j4 --raven --only-testers RavenFramework --tester-command RavenFramework raven_framework --skip-load-env
        continue-on-error: true
